<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>1010 컬러</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: 한 화면 모바일형 게임. 상단 점수줄, 중앙 10x10 보드, 하단 대기 블록 3칸. 시작/순위는 모달형 패널. */
:root{
  --bg:#12152b;
  --panel:#1b1f3d;
  --board:#232850;
  --cell:#2c3263;
  --fg:#eef0ff;
  --muted:#9aa0cf;
  --accent:#ffc93c;
  --line:#343b78;
  --c0:#ff5a5f; --c1:#3d8bff; --c2:#33d17a; --c3:#ffc93c; --c4:#b66dff; --c5:#ff8a3d;
  --display:'Jua','Noto Sans KR',system-ui,sans-serif;
  --body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-inline:16px;padding-block:12px;overflow-x:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:600px;margin-inline:auto;display:flex;flex-direction:column;gap:12px;align-items:center}

/* 시작 화면 */
#start{width:100%;display:flex;flex-direction:column;gap:18px;align-items:center;padding-block:4vh}
.logo{font-family:var(--display);font-size:clamp(44px,13vw,72px);line-height:1;letter-spacing:.02em;text-align:center}
.logo span{display:inline-block}
.sub{color:var(--muted);font-size:14px;text-align:center}
.card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
label{font-size:13px;color:var(--muted)}
#nick{width:100%;font:500 20px var(--body);background:var(--bg);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;user-select:text;-webkit-user-select:text}
.btn{font:400 22px var(--display);background:var(--accent);color:#2a2100;border:0;border-radius:14px;padding:12px 18px;box-shadow:0 4px 0 #b8901a}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b8901a}
.btn.ghost{background:var(--cell);color:var(--fg);box-shadow:0 4px 0 #1a1e42;font-size:18px}
.btn.ghost:active{box-shadow:0 1px 0 #1a1e42}
.err{color:#ff8a8f;font-size:13px;min-height:18px}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}

/* 순위표 */
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
.rank li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--bg);border-radius:10px;padding:8px 12px;font-variant-numeric:tabular-nums}
.rank li.me{outline:2px solid var(--accent)}
.rank .no{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center}
.rank li:nth-child(1) .no{color:#ffc93c}.rank li:nth-child(2) .no{color:#cfd6ff}.rank li:nth-child(3) .no{color:#ff9d5c}
.rank .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .sc{font-weight:700}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:10px}
.note{color:var(--muted);font-size:12px}

/* 게임 화면 */
#game{width:100%;display:flex;flex-direction:column;gap:12px;align-items:center}
.top{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
.who{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.who b{color:var(--fg);font-weight:700}
.scorebox{display:flex;gap:18px;align-items:flex-end}
.stat{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.stat small{font-size:11px;color:var(--muted)}
.stat strong{font:400 30px var(--display);font-variant-numeric:tabular-nums}
.stat.best strong{font-size:20px;color:var(--accent)}
.icons{display:flex;gap:6px}
.icon{width:40px;height:40px;border-radius:12px;border:0;background:var(--cell);font-size:18px}
#board{position:relative;display:grid;gap:var(--gap);padding:var(--pad);background:var(--board);border-radius:16px;touch-action:none}
.cell{width:var(--C);height:var(--C);background:var(--cell);border-radius:22%;position:relative}
.cell.f{background:var(--b);box-shadow:inset 0 -4px 0 rgba(0,0,0,.22),inset 0 3px 0 rgba(255,255,255,.28)}
.cell.g{background:var(--b);opacity:.5}
.cell.bad{background:#ff5a5f;opacity:.35}
.cell.will{animation:pulse .5s ease-in-out infinite alternate;z-index:1}
.cell.pop{animation:pop .3s ease-in forwards;z-index:2}
@keyframes pulse{from{box-shadow:inset 0 0 0 3px #fff}to{box-shadow:inset 0 0 0 3px rgba(255,255,255,.2)}}
@keyframes pop{0%{transform:scale(1);filter:brightness(1)}40%{transform:scale(1.18);filter:brightness(1.6)}100%{transform:scale(0);opacity:0}}
.drop{animation:drop .16s ease-out}
@keyframes drop{from{transform:scale(1.12)}to{transform:scale(1)}}
#tray{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);width:100%}
.slot{display:flex;align-items:center;justify-content:center;background:var(--panel);border-radius:14px;touch-action:none;cursor:grab;min-width:0}
.slot.dim .pc{opacity:.2}
.pc{position:relative}
.pc i{position:absolute;border-radius:22%;background:var(--b);box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.28)}
#float{position:fixed;left:0;top:0;pointer-events:none;z-index:50;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
.pts{position:fixed;z-index:60;font:400 28px var(--display);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 12px var(--accent);pointer-events:none;animation:rise .9s ease-out forwards}
@keyframes rise{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-60px);opacity:0}}
.hint{color:var(--muted);font-size:12px;text-align:center;min-height:32px}
.hint.on{color:var(--accent);font:400 18px var(--display)}
.cmb{position:fixed;left:50%;z-index:70;pointer-events:none;font-family:var(--display);line-height:1;text-align:center;color:#fff;white-space:nowrap;
  text-shadow:0 4px 0 rgba(0,0,0,.45),0 0 24px var(--glow,var(--accent));animation:cmb 1.1s cubic-bezier(.2,1.4,.4,1) forwards}
.cmb small{display:block;font-size:.38em;letter-spacing:.3em;color:var(--glow,var(--accent))}
@keyframes cmb{0%{transform:translate(-50%,0) scale(.2) rotate(-8deg);opacity:0}25%{transform:translate(-50%,0) scale(1.25) rotate(3deg);opacity:1}45%{transform:translate(-50%,0) scale(1) rotate(0)}80%{opacity:1}100%{transform:translate(-50%,-40px) scale(1.05);opacity:0}}
#board.shake{animation:shake .38s}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(calc(var(--sh,4px)*-1),2px)}40%{transform:translate(var(--sh,4px),-2px)}60%{transform:translate(calc(var(--sh,4px)*-.6),1px)}80%{transform:translate(calc(var(--sh,4px)*.6),-1px)}}
#flash{position:fixed;inset:0;z-index:55;pointer-events:none;background:radial-gradient(circle at 50% 45%,var(--glow,var(--accent)),transparent 65%);opacity:0;animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.5}100%{opacity:0}}
.part{position:fixed;z-index:58;pointer-events:none;border-radius:30%}

/* 모달 */
#modal{position:fixed;inset:0;background:rgba(8,10,25,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
#modal .card{max-width:440px;max-height:92%;overflow:auto}
.big{font:400 56px var(--display);text-align:center;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1}
.center{text-align:center}
.row{display:flex;gap:10px}
.row .btn{flex:1}
@media (prefers-reduced-motion:reduce){.cell.will,.cell.pop,.drop,.pts,#board.shake,#flash{animation:none}.part{display:none}}
</style>

<div id="app">
  <section id="start">
    <div class="logo" aria-label="1010 컬러"><span style="color:var(--c0)">1</span><span style="color:var(--c3)">0</span><span style="color:var(--c2)">1</span><span style="color:var(--c1)">0</span> <span style="color:var(--c4)">컬러</span></div>
    <p class="sub">같은 색 블록을 3칸 이상 붙이면 사라져요</p>
    <form class="card" id="loginForm">
      <label for="nick">아이디 (순위에 표시돼요)</label>
      <input id="nick" maxlength="12" autocomplete="off" placeholder="예: 요한" />
      <div class="err" id="err" role="alert"></div>
      <button class="btn" type="submit">게임 시작</button>
    </form>
    <div class="card">
      <h2>순위 TOP 5</h2>
      <ol class="rank" id="miniRank"></ol>
      <div class="note" id="miniNote"></div>
    </div>
  </section>

  <section id="game" hidden>
    <div class="top">
      <div class="who" id="who"></div>
      <div class="scorebox">
        <div class="stat"><small>점수</small><strong id="score">0</strong></div>
        <div class="stat best"><small>내 최고</small><strong id="best">0</strong></div>
      </div>
      <div class="icons">
        <button class="icon" id="resetBtn" aria-label="처음부터 다시 시작">↻</button>
        <button class="icon" id="rankBtn" aria-label="순위 보기">🏆</button>
        <button class="icon" id="muteBtn" aria-label="소리 켜기/끄기">🔊</button>
      </div>
    </div>
    <div id="board" aria-label="게임 보드"></div>
    <div id="tray"></div>
    <div class="hint" id="hint">블록을 끌어서 보드에 놓으세요. 같은 색이 상하좌우로 3칸 이상 이어지면 사라집니다.</div>
  </section>
</div>
<div id="float" hidden></div>
<div id="modal" hidden></div>

<script>
(function(){
'use strict';
const N=10, GAP=3, PAD=6;
const COLORS=['var(--c0)','var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];
const $=id=>document.getElementById(id);
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};

/* ---------- 블록 모양 ---------- */
function norm(cells){
  const mr=Math.min(...cells.map(c=>c[0])), mc=Math.min(...cells.map(c=>c[1]));
  return cells.map(([r,c])=>[r-mr,c-mc]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
}
function rot(cells){return norm(cells.map(([r,c])=>[c,-r]))}
function rotations(cells){
  const seen=new Set(), out=[]; let cur=norm(cells);
  for(let i=0;i<4;i++){const k=JSON.stringify(cur); if(!seen.has(k)){seen.add(k);out.push(cur)} cur=rot(cur)}
  return out;
}
const rect=(h,w)=>{const a=[];for(let r=0;r<h;r++)for(let c=0;c<w;c++)a.push([r,c]);return a};
/* 블록 모양: 칸마다 색은 블록이 만들어질 때 무작위로 정해진다(6색) */
const SHAPES=[
  {cells:rect(1,1)},
  ...[2,3,4,5].flatMap(n=>[rect(1,n),rect(n,1)]).map(cells=>({cells})),
  ...[rect(2,2),rect(2,3),rect(3,2),rect(3,3)].map(cells=>({cells})),
  ...rotations([[0,0],[1,0],[1,1]]).map(cells=>({cells})),
  ...rotations([[0,0],[1,0],[2,0],[2,1],[2,2]]).map(cells=>({cells}))
];

/* ---------- 상태 ---------- */
let combo=0, board, owner, pidN=0, pieces, score, best, over, busy, name, drag=null, preview=null;
let C=36, mini=18;
const boardEl=$('board'), trayEl=$('tray'), floatEl=$('float');
let cellEls=[];

/* ---------- 오디오 ---------- */
let actx=null, muted=store.get('tc_mute')==='1';
function beep(freqs,dur=.09,type='sine',vol=.08){
  if(muted)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+i*dur;
      o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur*1.6);
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur*1.7);
    });
  }catch(e){}
}
function syncMute(){$('muteBtn').textContent=muted?'🔇':'🔊'}

/* ---------- 순위 (공유 db + 이 브라우저 보조 저장) ---------- */
let dbRows=[], dbOk=false, dbWriteOk=true;
const hex=s=>Array.from(new TextEncoder().encode(s.toLowerCase())).map(b=>b.toString(16).padStart(2,'0')).join('');
const idOf=n=>'u'+hex(n);
function localRows(){try{return JSON.parse(store.get('tc_local')||'[]')}catch(e){return[]}}
function saveLocal(n,s){
  const rows=localRows(), id=idOf(n), r=rows.find(x=>x.id===id);
  if(r){if(s>r.best)r.best=s}else rows.push({id,name:n,best:s});
  store.set('tc_local',JSON.stringify(rows));
}
function allRows(){
  const map=new Map();
  for(const r of dbRows)map.set(r.id,r);
  for(const r of localRows()){const o=map.get(r.id);if(!o||r.best>o.best)map.set(r.id,r)}
  return [...map.values()].sort((a,b)=>b.best-a.best||a.name.localeCompare(b.name));
}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rankHtml(limit){
  const rows=allRows().slice(0,limit), me=name?idOf(name):'';
  if(!rows.length)return '<li class="empty" style="display:block">아직 기록이 없어요. 첫 번째 주인공이 되어 보세요!</li>';
  return rows.map((r,i)=>`<li class="${r.id===me?'me':''}"><span class="no">${i+1}</span><span class="nm">${esc(r.name)}</span><span class="sc">${r.best.toLocaleString()}</span></li>`).join('');
}
function renderMini(){
  $('miniRank').innerHTML=rankHtml(5);
  $('miniNote').textContent=dbOk?'':'이 브라우저에 저장된 기록만 보여요.';
}
async function loadBoard(){
  try{
    const r=await fetch('/api/scores',{cache:'no-store'});
    if(!r.ok)throw 0;
    const j=await r.json();
    dbOk=true;
    dbRows=j.map(v=>({id:idOf(String(v.name)),name:String(v.name),best:Number(v.best)||0}));
    renderMini(); if($('modal').dataset.kind==='rank')showRank(true);
  }catch(e){dbOk=false}
}
function initDb(){loadBoard();setInterval(()=>{if(!document.hidden)loadBoard()},15000)}
async function submit(n,s){
  saveLocal(n,s);
  try{
    const r=await fetch('/api/scores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,score:s})});
    dbWriteOk=r.ok;
  }catch(e){dbWriteOk=false}
  await loadBoard();
}
function myRank(){
  const me=idOf(name), i=allRows().findIndex(r=>r.id===me);
  return i<0?null:i+1;
}

/* ---------- 레이아웃 ---------- */
function layout(){
  const w=Math.min(window.innerWidth-32,560);
  let c=Math.floor((w-9*GAP-2*PAD)/N), m=Math.floor(c*.5);
  for(let k=0;k<3;k++){
    const trayH=5*m+16, avail=window.innerHeight-24-64-trayH-40-3*12;
    c=Math.max(22,Math.min(Math.floor((w-9*GAP-2*PAD)/N),Math.floor((avail-9*GAP-2*PAD)/N)));
    m=Math.max(12,Math.floor(c*.5));
  }
  C=c;mini=m;
  const bw=N*C+9*GAP+2*PAD;
  boardEl.style.setProperty('--C',C+'px');boardEl.style.setProperty('--gap',GAP+'px');boardEl.style.setProperty('--pad',PAD+'px');
  boardEl.style.gridTemplateColumns=`repeat(${N},${C}px)`;
  trayEl.style.setProperty('--gap',GAP+'px');trayEl.style.width=bw+'px';
  $('game').querySelector('.top').style.width=bw+'px';
  renderTray();
}
function buildBoard(){
  boardEl.innerHTML='';cellEls=[];
  for(let i=0;i<N*N;i++){const d=document.createElement('div');d.className='cell';boardEl.appendChild(d);cellEls.push(d)}
}

/* ---------- 렌더 ---------- */
function renderBoard(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const el=cellEls[r*N+c], v=board[r][c], pv=preview&&preview.map.get(r*N+c);
    let cls='cell', b=null;
    if(v>=0){cls+=' f';b=COLORS[v]}
    if(pv){
      if(pv.kind==='g'){cls=pv.ok?'cell g':'cell bad';b=COLORS[pv.color]}
      if(pv.will)cls+=' will';
    }
    if(el.dataset.pop==='1')cls+=' pop';
    el.className=cls;
    if(b)el.style.setProperty('--b',b);
  }
}
function pieceEl(p,cs,g){
  const rows=Math.max(...p.cells.map(c=>c[0]))+1, cols=Math.max(...p.cells.map(c=>c[1]))+1;
  const d=document.createElement('div');d.className='pc';
  d.style.width=(cols*(cs+g)-g)+'px';d.style.height=(rows*(cs+g)-g)+'px';
  p.cells.forEach(([r,c],k)=>{const i=document.createElement('i');i.style.cssText=`--b:${COLORS[p.colors[k]]};left:${c*(cs+g)}px;top:${r*(cs+g)}px;width:${cs}px;height:${cs}px`;d.appendChild(i)});
  return d;
}
function renderTray(){
  if(!pieces)return;
  trayEl.innerHTML='';
  pieces.forEach((p,i)=>{
    const s=document.createElement('div');s.className='slot'+(drag&&drag.i===i?' dim':'');
    s.style.height=(5*mini+4*2+16)+'px';s.dataset.i=i;
    if(p){s.appendChild(pieceEl(p,mini,2));s.addEventListener('pointerdown',e=>startDrag(e,i))}
    trayEl.appendChild(s);
  });
}
function setScore(v){score=v;$('score').textContent=v.toLocaleString();if(v>best){best=v;$('best').textContent=v.toLocaleString()}}

/* ---------- 규칙 ---------- */
function canPlace(b,cells,r,c){
  for(const [dr,dc] of cells){const rr=r+dr,cc=c+dc;if(rr<0||cc<0||rr>=N||cc>=N||b[rr][cc]>=0)return false}
  return true;
}
function clusters(b,o){
  const seen=Array.from({length:N},()=>Array(N).fill(false)), out=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(b[r][c]<0||seen[r][c])continue;
    const col=b[r][c], q=[[r,c]], list=[];seen[r][c]=true;
    while(q.length){
      const [y,x]=q.pop();list.push([y,x]);
      for(const [dy,dx] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const ny=y+dy,nx=x+dx;
        if(ny>=0&&nx>=0&&ny<N&&nx<N&&!seen[ny][nx]&&b[ny][nx]===col){seen[ny][nx]=true;q.push([ny,nx])}
      }
    }
    if(list.length>=3)out.push(list);
  }
  return out;
}
function clusterScore(cl){
  const base=cl.reduce((s,l)=>s+l.length*5+Math.max(0,l.length-3)*5,0);
  return base*cl.length;
}
function anyFit(p){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(canPlace(board,p.cells,r,c))return true;
  return false;
}
function newPiece(){const s=SHAPES[Math.floor(Math.random()*SHAPES.length)];return{cells:s.cells,colors:s.cells.map(()=>Math.floor(Math.random()*COLORS.length)),id:++pidN}}
function dealPieces(){
  for(let t=0;t<30;t++){
    const ps=[newPiece(),newPiece(),newPiece()];
    if(ps.some(anyFit)||t===29){pieces=ps;return}
  }
}

/* ---------- 드래그 ---------- */
function startDrag(e,i){
  if(busy||over||!pieces[i])return;
  e.preventDefault();
  const p=pieces[i], touch=e.pointerType!=='mouse';
  const rows=Math.max(...p.cells.map(c=>c[0]))+1, cols=Math.max(...p.cells.map(c=>c[1]))+1, step=C+GAP;
  drag={i,p,w:cols*step-GAP,h:rows*step-GAP,lift:touch?step*1.8:step*.6,x:e.clientX,y:e.clientY};
  floatEl.innerHTML='';floatEl.appendChild(pieceEl(p,C,GAP));floatEl.hidden=false;
  renderTray();moveDrag();
  window.addEventListener('pointermove',onMove);
  window.addEventListener('pointerup',onUp);
  window.addEventListener('pointercancel',onCancel);
  beep([520],.05,'triangle',.04);
}
function dragCell(){
  const rc=boardEl.getBoundingClientRect(), step=C+GAP;
  const left=drag.x-drag.w/2, top=drag.y-drag.h-drag.lift;
  return{r:Math.round((top-rc.top-PAD)/step),c:Math.round((left-rc.left-PAD)/step),left,top};
}
function moveDrag(){
  const g=dragCell();
  floatEl.style.transform=`translate(${g.left}px,${g.top}px)`;
  const p=drag.p, rows=Math.max(...p.cells.map(c=>c[0])), cols=Math.max(...p.cells.map(c=>c[1]));
  const inside=g.r>-1&&g.c>-1&&g.r+rows<N&&g.c+cols<N;
  const near=g.r>-3&&g.c>-3&&g.r<N+1&&g.c<N+1;
  if(!near){preview=null;drag.target=null;renderBoard();return}
  const ok=inside&&canPlace(board,p.cells,g.r,g.c), map=new Map();
  p.cells.forEach(([dr,dc],k)=>{const rr=g.r+dr,cc=g.c+dc;if(rr>=0&&cc>=0&&rr<N&&cc<N&&(ok||board[rr][cc]<0))map.set(rr*N+cc,{kind:'g',ok,color:p.colors[k]})});
  if(ok){
    const t=board.map(r=>r.slice()), o=owner.map(r=>r.slice());
    p.cells.forEach(([dr,dc],k)=>{t[g.r+dr][g.c+dc]=p.colors[k];o[g.r+dr][g.c+dc]=p.id});
    for(const cl of clusters(t,o))for(const [y,x] of cl){const k=y*N+x,o=map.get(k);if(o)o.will=true;else map.set(k,{kind:'w',will:true})}
  }
  preview={map};drag.target=ok?{r:g.r,c:g.c}:null;renderBoard();
}
function onMove(e){if(!drag)return;drag.x=e.clientX;drag.y=e.clientY;moveDrag()}
function endDrag(){
  window.removeEventListener('pointermove',onMove);window.removeEventListener('pointerup',onUp);window.removeEventListener('pointercancel',onCancel);
  floatEl.hidden=true;preview=null;
}
function onCancel(){const d=drag;drag=null;endDrag();renderBoard();renderTray();}
function onUp(){
  const d=drag, t=d&&d.target;
  drag=null;endDrag();
  if(d&&t){place(d.i,d.p,t.r,t.c)}else{renderBoard();renderTray()}
}

/* ---------- 배치 / 소멸 ---------- */
async function place(i,p,r,c){
  busy=true;
  p.cells.forEach(([dr,dc],k)=>{board[r+dr][c+dc]=p.colors[k];owner[r+dr][c+dc]=p.id;cellEls[(r+dr)*N+c+dc].classList.add('drop')});
  pieces[i]=null;
  beep([330,440],.05,'triangle',.06);
  renderBoard();renderTray();
  const cl=clusters(board,owner);
  if(cl.length){
    combo++;
    const mult=combo, gain=clusterScore(cl)*mult;
    cl.flat().forEach(([y,x])=>{cellEls[y*N+x].dataset.pop='1'});
    renderBoard();
    const f=cl[0], cy=f.reduce((s,a)=>s+a[0],0)/f.length, cx=f.reduce((s,a)=>s+a[1],0)/f.length;
    const rc=boardEl.getBoundingClientRect(), step=C+GAP;
    popText('+'+gain+(cl.length>1?` x${cl.length}`:''),rc.left+PAD+(cx+.5)*step,rc.top+PAD+(cy+.5)*step);
    burst(cl,rc,step,mult);
    if(mult>=2)showCombo(mult,rc);
    setHint();
    const base=[523,659,784,1047,1319,1568];
    beep(base.slice(Math.min(mult-1,3),Math.min(mult-1,3)+Math.min(4,2+cl.length)),.07,'sine',.08);
    await new Promise(res=>setTimeout(res,320));
    cl.flat().forEach(([y,x])=>{board[y][x]=-1;owner[y][x]=-1;delete cellEls[y*N+x].dataset.pop});
    setScore(score+gain);
    renderBoard();
  }else if(combo){combo=0;setHint()}
  if(pieces.every(x=>!x)){dealPieces();renderTray()}
  busy=false;
  if(!pieces.some(x=>x&&anyFit(x)))finish();
}
const DEF_HINT='블록을 끌어서 보드에 놓으세요. 같은 색이 상하좌우로 3칸 이상 이어지면 사라집니다.';
function setHint(){
  const h=$('hint');
  if(combo>=1){h.className='hint on';h.textContent=`🔥 콤보 x${combo} 진행 중! 다음 블록도 지우면 x${combo+1}`}
  else{h.className='hint';h.textContent=DEF_HINT}
}
function comboGlow(n){return ['#ffc93c','#ff8a3d','#ff5a5f','#ff7ac8','#b66dff','#3d8bff'][Math.min(n-2,5)]}
function showCombo(n,rc){
  const glow=comboGlow(n);
  const d=document.createElement('div');d.className='cmb';
  d.style.setProperty('--glow',glow);
  d.style.fontSize=Math.min(84,44+n*8)+'px';
  d.style.top=(rc.top+rc.height*.3)+'px';
  d.innerHTML=`<small>COMBO</small>x${n}`;
  document.body.appendChild(d);setTimeout(()=>d.remove(),1150);
  const f=document.createElement('div');f.id='flash';f.style.setProperty('--glow',glow);
  document.body.appendChild(f);setTimeout(()=>f.remove(),520);
  boardEl.style.setProperty('--sh',Math.min(14,3+n*2)+'px');
  boardEl.classList.remove('shake');void boardEl.offsetWidth;boardEl.classList.add('shake');
  beep([392,523,659].map(v=>v*(1+.06*Math.min(n,6))),.06,'square',.04);
}
function burst(cl,rc,step,mult){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const per=mult>=2?4:2, cells=cl.flat();
  for(const [y,x] of cells){
    const cx=rc.left+PAD+(x+.5)*step, cy=rc.top+PAD+(y+.5)*step, col=COLORS[board[y][x]];
    for(let k=0;k<per;k++){
      const p=document.createElement('div'),sz=4+Math.random()*(mult>=2?9:6);
      p.className='part';p.style.cssText=`left:${cx-sz/2}px;top:${cy-sz/2}px;width:${sz}px;height:${sz}px;background:${col}`;
      document.body.appendChild(p);
      const a=Math.random()*Math.PI*2,dist=(30+Math.random()*50)*(1+Math.min(mult,5)*.25);
      const an=p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*dist}px,${Math.sin(a)*dist+20}px) scale(.2) rotate(${Math.random()*360}deg)`,opacity:0}],{duration:550+Math.random()*350,easing:'cubic-bezier(.2,.8,.4,1)'});
      an.onfinish=()=>p.remove();
    }
  }
}
function popText(t,x,y){
  const d=document.createElement('div');d.className='pts';d.textContent=t;d.style.left=x+'px';d.style.top=y+'px';
  document.body.appendChild(d);setTimeout(()=>d.remove(),950);
}

/* ---------- 흐름 ---------- */
function newGame(){
  board=Array.from({length:N},()=>Array(N).fill(-1));
  owner=Array.from({length:N},()=>Array(N).fill(-1));
  score=0;combo=0;over=false;busy=false;preview=null;drag=null;setHint();
  $('score').textContent='0';
  best=Number(store.get('tc_best_'+idOf(name)))||0;
  const mine=allRows().find(r=>r.id===idOf(name));if(mine&&mine.best>best)best=mine.best;
  $('best').textContent=best.toLocaleString();
  dealPieces();buildBoard();layout();renderBoard();
}
function showGame(){
  $('start').hidden=true;$('game').hidden=false;
  $('who').innerHTML='플레이어 <b>'+esc(name)+'</b>';
  newGame();
}
async function finish(){
  over=true;
  store.set('tc_best_'+idOf(name),String(best));
  beep([392,330,262],.14,'sawtooth',.05);
  setModal('over',`<div class="center"><h2>게임 종료</h2></div><div class="big">${score.toLocaleString()}</div><div class="center note">순위를 기록하는 중…</div>`);
  await submit(name,score);
  const rk=myRank();
  setModal('over',`<div class="center"><h2>게임 종료</h2></div>
    <div class="big">${score.toLocaleString()}</div>
    <div class="center">${rk?`현재 <b>${rk}위</b> (내 최고 ${best.toLocaleString()}점)`:''}</div>
    <ol class="rank">${rankHtml(10)}</ol>
    ${dbOk&&!dbWriteOk?'<div class="note center">공유 순위에 기록할 권한이 없어 이 브라우저에만 저장했어요.</div>':''}
    <div class="row"><button class="btn" id="again">다시 하기</button><button class="btn ghost" id="toStart">처음으로</button></div>`);
  $('again').onclick=()=>{closeModal();newGame()};
  $('toStart').onclick=()=>{closeModal();toStart()};
}
function toStart(){$('game').hidden=true;$('start').hidden=false;renderMini();$('nick').focus()}
function setModal(kind,html){const m=$('modal');m.dataset.kind=kind;m.innerHTML='<div class="card" role="dialog" aria-modal="true">'+html+'</div>';m.hidden=false}
function closeModal(){const m=$('modal');m.hidden=true;m.dataset.kind='';m.innerHTML=''}
function showRank(refresh){
  setModal('rank',`<h2>🏆 전체 순위</h2><ol class="rank">${rankHtml(30)}</ol>${dbOk?'':'<div class="note">이 브라우저에 저장된 기록만 보여요.</div>'}<button class="btn ghost" id="closeRank">닫기</button>`);
  $('closeRank').onclick=closeModal;
}

/* ---------- 이벤트 ---------- */
$('loginForm').addEventListener('submit',e=>{
  e.preventDefault();
  const v=$('nick').value.trim();
  if(!v){$('err').textContent='아이디를 입력해 주세요.';return}
  if(v.length>12){$('err').textContent='아이디는 12자 이하로 입력해 주세요.';return}
  $('err').textContent='';name=v;store.set('tc_name',v);showGame();
});
$('resetBtn').onclick=()=>{
  if(busy||drag||over)return;
  setModal('reset',`<h2>처음부터 다시 시작할까요?</h2><div class="note">지금 점수(${score.toLocaleString()}점)는 순위에 기록되지 않고 보드가 비워져요.</div><div class="row"><button class="btn" id="yesReset">초기화</button><button class="btn ghost" id="noReset">취소</button></div>`);
  $('yesReset').onclick=()=>{closeModal();newGame();beep([392,523],.07,'triangle',.06)};
  $('noReset').onclick=closeModal;
};
$('rankBtn').onclick=()=>showRank();
$('muteBtn').onclick=()=>{muted=!muted;store.set('tc_mute',muted?'1':'0');syncMute()};
$('modal').addEventListener('pointerdown',e=>{if(e.target===$('modal')&&$('modal').dataset.kind==='rank')closeModal()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&['rank','reset'].includes($('modal').dataset.kind))closeModal()});
window.addEventListener('resize',()=>{if(!$('game').hidden){layout();renderBoard()}});
document.addEventListener('contextmenu',e=>{if(drag)e.preventDefault()});

const saved=store.get('tc_name');if(saved)$('nick').value=saved;
syncMute();renderMini();initDb();
})();
</script>
